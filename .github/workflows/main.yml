name: Web to APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webapk tools
        run: npm install -g @webapk/cli

      - name: Build APK from web
        run: webapk build --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: dist/*.apk
